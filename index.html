<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PDF Paraphrasing Processor • v3</title>
<style>
body{font-family:system-ui,Arial;max-width:1000px;margin:auto;padding:16px;background:#f5f5f5;color:#171717}
.card{background:#fff;padding:20px;border:1px solid #ddd;border-radius:14px}
.button{padding:12px 16px;margin-top:12px;border:0;border-radius:9px;background:#111;color:#fff;font-weight:600;width:100%}
.status{display:flex;justify-content:space-between;margin-top:18px;font-weight:600}
#bar{height:10px;background:#ddd;margin-top:12px;border-radius:99px;overflow:hidden}
#fill{height:100%;background:#222;width:0;transition:width .3s}
#logbox{margin-top:18px;border:1px solid #ddd;border-radius:10px;background:#101010;color:#eee;height:300px;overflow:auto;padding:10px;font-family:monospace;font-size:12px}
.log{padding:5px 2px;border-bottom:1px solid #252525}.time{color:#999}.success{color:#8fdf9b}.error{color:#ff8d8d}
.small,.hint{color:#666;font-size:13px}
#job{font-family:monospace;font-size:11px;word-break:break-all}
.info{margin-top:16px;padding:12px;border-radius:10px;background:#f3f3f3}
</style>
</head>
<body>
<div class="card">
<h1>PDF Paraphrasing Processor</h1>
<p>Upload a PDF. The processor extracts the text, splits it below ExampdfX's 3,000-character input limit, sends each chunk in <b>Formal</b> mode, then creates a DOCX.</p>
<div class="info">Backend: Railway • Rewriter: ExampdfX • Chunks: up to 2,800 characters</div>

<input id="file" type="file" accept=".pdf">
<button class="button" onclick="run()">Start processing</button>

<div class="status"><span id="status">Idle</span><span id="count">0 / 0</span></div>
<div id="bar"><div id="fill"></div></div>
<p class="small">Job ID: <span id="job">—</span></p>

<div id="logbox"></div>
<button id="download" class="button" style="display:none" onclick="downloadFile()">Download DOCX</button>
</div>

<script>
const DEFAULT_API="https://document-processor-exampdfx-production.up.railway.app";
const API_BASE=(location.hostname.endsWith(".up.railway.app") ? location.origin : DEFAULT_API);
const $=id=>document.getElementById(id);
let jobId=null;

async function readResponse(r){
 const text=await r.text();
 let data=null;
 try{data=JSON.parse(text)}catch(e){}
 if(!r.ok){
   throw Error((data&&data.error)||('Backend returned HTTP '+r.status));
 }
 if(data===null) throw Error('Backend returned a non-JSON response');
 return data;
}

async function run(){
 const f=$('file').files[0];
 if(!f){$('status').textContent='Select a PDF';return;}
 $('status').textContent='Uploading PDF...';
 $('download').style.display='none';
 $('logbox').innerHTML='';
 $('job').textContent='—';
 $('count').textContent='0 / 0';
 $('fill').style.width='0%';

 const fd=new FormData();
 fd.append('file',f);

 try{
  const r=await fetch(API_BASE+'/api/process-pdf',{method:'POST',body:fd});
  const d=await readResponse(r);
  jobId=d.jobId;
  $('job').textContent=jobId;
  $('status').textContent=d.message||d.status||'Queued';
  await refresh();
 }catch(e){
  $('status').textContent=e.message;
  $('logbox').innerHTML='<div class="log error">'+esc(e.message)+'</div>';
 }
}

async function refresh(){
 if(!jobId)return;
 try{
  const r=await fetch(API_BASE+'/api/jobs/'+encodeURIComponent(jobId));
  const d=await readResponse(r);

  $('status').textContent=d.message||d.status;
  $('count').textContent=(d.current||0)+' / '+(d.total||0);
  if(d.total)$('fill').style.width=(d.current/d.total*100)+'%';

  $('logbox').innerHTML=(d.logs||[]).map(x=>
    '<div class="log '+esc(x.level||'info')+'"><span class="time">['+esc(x.time||'')+']</span> '+esc(x.message||'')+'</div>'
  ).join('');
  $('logbox').scrollTop=$('logbox').scrollHeight;

  if(d.status==='Completed')$('download').style.display='block';
 }catch(e){
  if(jobId)$('status').textContent=e.message;
 }
}

function esc(s){
 return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

function downloadFile(){
 if(jobId)window.location.href=API_BASE+'/api/jobs/'+encodeURIComponent(jobId)+'/download';
}

setInterval(refresh,1000);
</script>
</body>
</html>
