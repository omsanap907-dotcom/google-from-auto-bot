<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Text Processor</title>
<style>body{font-family:Arial,sans-serif;max-width:900px;margin:auto;padding:24px;background:#f6f6f6}.card{background:#fff;padding:20px;border:1px solid #ddd;border-radius:12px}textarea{width:100%;min-height:260px;box-sizing:border-box;padding:12px}button{padding:10px 16px;margin:10px 8px 0 0}.muted{color:#666}pre{white-space:pre-wrap}</style>
</head><body><div class="card"><h1>Text Processor</h1><p class="muted">Browser automation for the configured third-party text-processing site. Maximum 500 words per request.</p><textarea id="i" placeholder="Paste up to 500 words"></textarea><br><button onclick="run()">Process</button><button onclick="inspect()">Check site</button><p id="s"></p></div><div class="card"><h2>Output</h2><pre id="o"></pre><button onclick="navigator.clipboard.writeText(o.textContent)">Copy</button></div>
<script>
async function inspect(){s.textContent='Checking...';const r=await fetch('/api/inspect',{method:'POST'});s.textContent=JSON.stringify(await r.json(),null,2)}
async function run(){const t=i.value.trim();if(!t)return;s.textContent='Processing...';const r=await fetch('/api/process',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:t})});const d=await r.json();if(!r.ok){s.textContent=d.error||'Failed';return}o.textContent=d.output||'';s.textContent='Done'}
</script></body></html>
