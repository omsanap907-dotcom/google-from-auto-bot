<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Document Processor</title><style>body{font-family:Arial;max-width:850px;margin:auto;padding:24px;background:#f5f5f5}.card{background:#fff;padding:20px;border:1px solid #ddd;border-radius:12px}button{padding:11px 16px;margin-top:12px}#bar{height:10px;background:#ddd;margin-top:15px}#fill{height:100%;background:#222;width:0}</style><div class="card"><h1>Document Processor</h1><p>Upload a PDF. The bot processes extracted text sequentially in batches of up to 500 words.</p><input id="file" type="file" accept=".pdf"><br><button onclick="run()">Process complete document</button><p id="status"></p><div id="bar"><div id="fill"></div></div></div><script>async function run(){if(!file.files[0])return status.textContent='Select a PDF';let fd=new FormData();fd.append('file',file.files[0]);status.textContent='Processing...';let r=await fetch('/api/process-pdf',{method:'POST',body:fd});if(!r.ok){status.textContent=await r.text();return}let b=await r.blob(),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='processed_document.docx';a.click();URL.revokeObjectURL(u);status.textContent='Completed'}setInterval(async()=>{try{let d=await(await fetch('/api/status')).json();status.textContent=d.message||d.status;if(d.total)fill.style.width=(d.current/d.total*100)+'%'}catch(e){}},1500)</script>
